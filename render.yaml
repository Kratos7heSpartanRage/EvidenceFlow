services:
  - type: web
    name: evidenceflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: evidenceflow-db
          property: connectionString
      - key: NCBI_TOOL
        value: evidenceflow
      - key: NCBI_EMAIL
        sync: false
      - key: NCBI_API_KEY
        sync: false

databases:
  - name: evidenceflow-db
    plan: free
    databaseName: evidenceflow
    user: evidenceflow
