databases:
  - name: evidenceflow-db
    databaseName: evidenceflow
    user: evidenceflow
    plan: free

services:
  # Backend API Web Service
  - type: web
    name: evidenceflow-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && alembic -c backend/alembic.ini upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        fromDatabase:
          name: evidenceflow-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: NCBI_EMAIL
        value: researcher@example.edu
      - key: NCBI_TOOL
        value: evidenceflow

  # Frontend React/Vite Static Site
  - type: static
    name: evidenceflow-frontend
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: evidenceflow-backend
          property: host

